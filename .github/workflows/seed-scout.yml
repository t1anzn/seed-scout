name: seed-scout

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:          # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency: seed-scout

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python seed_scout.py --out docs/seed_jobs.csv --json docs/jobs.json --state seed_scout_state.json
      - name: Save results
        run: |
          git config user.name "seed-scout"
          git config user.email "actions@users.noreply.github.com"
          git add docs/seed_jobs.csv docs/jobs.json seed_scout_state.json
          git diff --cached --quiet || git commit -m "seed-scout: update results"
          git push
