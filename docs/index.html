<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seed Scout</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1b1d1f; --muted: #6a6f76; --line: #e3e1da;
    --accent: #0b6e4f; --accent-soft: #e2f1eb; --warn: #9a5b00; --warn-soft: #fbefd9;
    --blue: #1f5fa8; --blue-soft: #e4eefa;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131517; --card: #1c1f22; --ink: #ecebe6; --muted: #979ca3; --line: #2c3035;
      --accent: #5fd0a5; --accent-soft: #17322a; --warn: #f0b860; --warn-soft: #3a2c12;
      --blue: #8fbcf2; --blue-soft: #1a2a3d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 28px 16px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  #meta { color: var(--muted); font-size: 13px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 6px; }
  .dot.stale { background: var(--warn); }
  #tabs { display: flex; gap: 6px; margin: 20px 0 12px; flex-wrap: wrap; }
  #tabs button { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 6px 12px;
    border-radius: 999px; cursor: pointer; font: inherit; font-size: 14px; }
  #tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  #tabs .n { opacity: .65; margin-left: 4px; font-variant-numeric: tabular-nums; }
  #controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  #controls input[type=search], #controls select { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  #controls input[type=search] { flex: 1 1 200px; min-width: 0; }
  #controls label { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .card.dismissed { opacity: .55; }
  .top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .company { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .title { font-size: 16px; font-weight: 600; color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
  a.title:hover { text-decoration: underline; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
  .chip.new { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
  .chip.grad { background: var(--blue-soft); color: var(--blue); border-color: transparent; }
  .chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .funding { margin-top: 8px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .funding a { color: inherit; }
  .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .actions button { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); cursor: pointer; }
  .actions button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); }
  #empty { color: var(--muted); padding: 40px 0; text-align: center; }
  @media (max-width: 560px) { .top { flex-direction: column; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Seed Scout</h1>
    <div id="meta">Loading…</div>
  </header>
  <div id="tabs" role="group" aria-label="Status"></div>
  <div id="controls">
    <input id="q" type="search" placeholder="Search company, title, location" aria-label="Search">
    <select id="loc" aria-label="Location">
      <option value="">All locations</option><option value="0">Netherlands</option><option value="1">UK</option>
    </select>
    <select id="kind" aria-label="Role type">
      <option value="">All role types</option><option value="core">Applied AI / ML</option>
      <option value="adjacent">Adjacent titles</option><option value="company">YC company leads</option>
    </select>
    <label><input id="grad" type="checkbox"> Graduate signal only</label>
  </div>
  <div id="list"></div>
  <div id="empty" hidden></div>
</main>
<script>
"use strict";
const KEY = "seedscout.status.v1";
const REFRESH_MS = 5 * 60 * 1000;
const TABS = [["inbox", "Inbox"], ["saved", "Saved"], ["applied", "Applied"], ["dismissed", "Dismissed"]];
let rows = [], generated = null, tab = "inbox", loadError = "";
let status = {};
try { status = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { status = {}; }
function saveStatus() { try { localStorage.setItem(KEY, JSON.stringify(status)); } catch (e) {} }

const $ = (id) => document.getElementById(id);
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;   // textContent only: scraped data is untrusted
  return n;
}
function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (isNaN(mins)) return "unknown";
  if (mins < 1) return "just now";
  if (mins < 60) return mins + " min ago";
  if (mins < 48 * 60) return Math.round(mins / 60) + " h ago";
  return Math.round(mins / 1440) + " days ago";
}
function isRecent(r) {
  const d = new Date(r.first_seen + "T00:00:00Z").getTime();
  return !isNaN(d) && Date.now() - d < 3 * 86400000;
}
function stateOf(r) { return status[r.url] || "inbox"; }

function visible() {
  const q = $("q").value.trim().toLowerCase(), loc = $("loc").value, kind = $("kind").value, grad = $("grad").checked;
  return rows.filter((r) => {
    if (stateOf(r) !== tab) return false;
    if (loc !== "" && String(r.loc_tier) !== loc) return false;
    if (kind && r.match !== kind) return false;
    if (grad && r.grad_signal !== "yes") return false;
    if (q && !(r.company + " " + r.title + " " + r.location).toLowerCase().includes(q)) return false;
    return true;
  });
}

function card(r) {
  const st = stateOf(r);
  const c = el("div", "card" + (st === "dismissed" ? " dismissed" : ""));
  const top = el("div", "top");
  const left = el("div");
  left.appendChild(el("div", "company", r.company || "Unknown company"));
  const url = safeUrl(r.url);
  const t = el(url ? "a" : "span", "title", r.title || "(untitled role)");
  if (url) { t.href = url; t.target = "_blank"; t.rel = "noopener noreferrer"; }
  left.appendChild(t);
  top.appendChild(left);

  const actions = el("div", "actions");
  [["saved", "Save"], ["applied", "Applied"], ["dismissed", "Dismiss"]].forEach(([s, label]) => {
    const b = el("button", "", label);
    b.type = "button";
    b.setAttribute("aria-pressed", String(st === s));
    b.addEventListener("click", () => {
      if (status[r.url] === s) delete status[r.url]; else status[r.url] = s;   // click again to undo
      saveStatus(); render();
    });
    actions.appendChild(b);
  });
  top.appendChild(actions);
  c.appendChild(top);

  const chips = el("div", "chips");
  if (isRecent(r)) chips.appendChild(el("span", "chip new", "New"));
  if (r.grad_signal === "yes") chips.appendChild(el("span", "chip grad", "Graduate signal"));
  chips.appendChild(el("span", "chip", r.location || "Location not stated"));
  if (r.match === "adjacent") chips.appendChild(el("span", "chip", "Adjacent title"));
  if (r.match === "company") chips.appendChild(el("span", "chip", "Company lead"));
  if (r.min_years_exp !== "" && r.min_years_exp != null) chips.appendChild(el("span", "chip warn", r.min_years_exp + "+ yrs asked"));
  if (r.visa_or_relocation_mentioned === "yes") chips.appendChild(el("span", "chip", "Mentions visa / relocation"));
  if (r.posted) chips.appendChild(el("span", "chip", "Posted " + r.posted));
  if (r.open_roles_on_board !== "" && r.open_roles_on_board != null) chips.appendChild(el("span", "chip", r.open_roles_on_board + " open roles"));
  if (r.board_match === "partial") chips.appendChild(el("span", "chip warn", "Check it's the right company"));
  c.appendChild(chips);

  if (r.funding_headline) {
    const f = el("div", "funding");
    const bits = [r.funding_amount, r.funding_date].filter(Boolean).join(" · ");
    const link = safeUrl(r.funding_link);
    f.appendChild(document.createTextNode((bits ? bits + " — " : "")));
    const h = el(link ? "a" : "span", "", r.funding_headline);
    if (link) { h.href = link; h.target = "_blank"; h.rel = "noopener noreferrer"; }
    f.appendChild(h);
    c.appendChild(f);
  }
  return c;
}

function render() {
  const counts = { inbox: 0, saved: 0, applied: 0, dismissed: 0 };
  rows.forEach((r) => { counts[stateOf(r)]++; });
  const tabs = $("tabs");
  tabs.replaceChildren();
  TABS.forEach(([id, label]) => {
    const b = el("button", "", label);
    b.type = "button";
    b.setAttribute("aria-pressed", String(tab === id));
    b.appendChild(el("span", "n", String(counts[id])));
    b.addEventListener("click", () => { tab = id; render(); });
    tabs.appendChild(b);
  });

  const meta = $("meta");
  meta.replaceChildren();
  if (loadError && !generated) {
    meta.textContent = loadError;
  } else if (generated) {
    const stale = Date.now() - new Date(generated).getTime() > 12 * 3600000;
    meta.appendChild(el("span", "dot" + (stale ? " stale" : "")));
    meta.appendChild(document.createTextNode("Scraper last ran " + ago(generated) + " · " + rows.length + " roles"
      + (loadError ? " · refresh failed, showing last data" : "")));
  }

  const list = $("list"), shown = visible();
  list.replaceChildren(...shown.map(card));
  const empty = $("empty");
  empty.hidden = shown.length > 0;
  if (!shown.length) {
    empty.textContent = !generated ? (loadError || "Loading…")
      : rows.length === 0 ? "The scraper ran but found no matching roles yet. The watchlist builds up over the first week or two."
      : "Nothing here with these filters.";
  }
}

async function load() {
  try {
    const res = await fetch("jobs.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    rows = Array.isArray(data.rows) ? data.rows.filter((r) => r && typeof r === "object" && r.url) : [];
    generated = data.generated || null;
    loadError = "";
  } catch (e) {
    loadError = "Couldn't load jobs.json (" + e.message + "). Has the scraper run yet?";
  }
  render();
}

["q", "loc", "kind", "grad"].forEach((id) => $(id).addEventListener("input", render));
load();
setInterval(load, REFRESH_MS);
setInterval(render, 60000);   // keep "x min ago" fresh
</script>
</body>
</html>
